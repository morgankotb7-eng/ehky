name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # Static build from BtbN/FFmpeg-Builds (hosted on GitHub, includes libass); avoids slow apt mirrors.
          curl -fsSL --retry 3 -o ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          rm ffmpeg.tar.xz
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: brew install ffmpeg
      - name: Install ehky
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: ehky doctor
        run: ehky doctor
      - name: Render a real video offline (own recording)
        shell: bash
        run: |
          ffmpeg -y -loglevel error -f lavfi -i "sine=f=220:d=5" rec.wav
          ehky init demo --template tutorial
          if python -c "import sys; from ehky.compose import has_libass; sys.exit(0 if has_libass('ffmpeg') else 1)"; then
            ehky make demo --audio rec.wav
          else
            echo "This ffmpeg has no libass: ehky must refuse subtitles cleanly, then render without them."
            if ehky make demo --audio rec.wav; then exit 1; fi
            ehky make demo --audio rec.wav --no-subtitles
          fi
          ffprobe -v error -show_entries format=duration -of csv=p=0 demo/video.mp4
